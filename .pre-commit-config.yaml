# One config for the whole repo: pre-commit reads it only from the repo root.
# The configs inside lab01/ and lab01-homework/ are kept as part of those labs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/rubik/xenon
    rev: v0.9.0
    hooks:
      - id: xenon
        args: ['--max-absolute=B', '--max-modules=B', '--max-average=A']
        files: ^lab01/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--config-file=lab01-homework/pyproject.toml]
        files: ^lab01-homework/
